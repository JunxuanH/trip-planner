name: Deploy Italy 2026 plan to Pages

on:
  push:
    branches: [claude/travel-planner-italy-2026]
    paths:
      - 'italy-2026/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: italy-2026/dist
      - id: deployment
        uses: actions/deploy-pages@v4
